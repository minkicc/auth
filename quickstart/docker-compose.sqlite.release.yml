services:
  redis:
    image: redis:7.0
    container_name: auth-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-server:
    image: ${AUTH_IMAGE:-ghcr.io/example/auth:latest}
    pull_policy: always
    container_name: auth-server
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AUTH_PUBLIC_URL: "${AUTH_PUBLIC_URL:-http://127.0.0.1:8080}"
      AUTH_DEMO_BACKEND_SECRET: "${AUTH_DEMO_BACKEND_SECRET:-}"
    volumes:
      - ./config.sqlite.yaml:/app/config/config.yaml
      - sqlite_data:/app/data
    ports:
      - "127.0.0.1:8080:80"

  oidc-demo:
    image: nginx:alpine
    container_name: auth-oidc-demo
    restart: always
    volumes:
      - ./oidc-demo:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:3000:80"

volumes:
  redis_data:
  sqlite_data:
