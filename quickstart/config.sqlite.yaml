db:
  driver: "sqlite"
  sqlite_path: "/app/data/auth.sqlite3"

redis:
  addr: "redis:6379"
  password: ""
  db: 0

registration:
  mode: "open"
  require_invitation_for: []
  bootstrap_invitation_code: ""

storage:
  provider: "minio"
  endpoint: "minio:9000"
  region: "us-east-1"
  accessKeyID: "CHANGE_ME_minio_access"
  secretAccessKey: "CHANGE_ME_minio_secret"
  stsAccessKeyID: "user"
  stsSecretAccessKey: "CHANGE_ME_minio_sts_secret"
  attatchBucket: "attatch"

storage_public_url:
  attatch: "http://127.0.0.1:9002/attatch"

oidc:
  enabled: true
  issuer: ""
  key_id: "auth-quickstart"
  private_key_file: "/app/config/oidc-private-key.pem"
  code_ttl_seconds: 300
  access_token_ttl_seconds: 900
  id_token_ttl_seconds: 900
  clients:
    - client_id: "demo-spa"
      public: true
      require_pkce: true
      redirect_uris:
        - "http://127.0.0.1:3000/"
        - "http://localhost:3000/"
      scopes:
        - "openid"
        - "profile"
        - "email"
    - client_id: "demo-backend"
      client_secret: "demo-backend-secret"
      public: false
      require_pkce: true
      redirect_uris:
        - "http://127.0.0.1:8082/auth/callback"
        - "http://localhost:8082/auth/callback"
      scopes:
        - "openid"
        - "profile"
        - "email"
    - client_id: "one_api"
      public: true
      require_pkce: true
      redirect_uris:
        - "http://localhost:3000/oauth/oidc"
        - "http://127.0.0.1:3000/oauth/oidc"
        - "http://localhost:3000/"
        - "http://127.0.0.1:3000/"
      scopes:
        - "openid"
        - "profile"
        - "email"
    - client_id: "demo-client"
      public: true
      require_pkce: true
      redirect_uris:
        - "http://localhost:5173/auth/callback"
        - "http://localhost:5173/merchant?logged_out=1"
        - "http://127.0.0.1:5173/auth/callback"
        - "http://127.0.0.1:5173/merchant?logged_out=1"
      scopes:
        - "openid"
        - "profile"
        - "email"
    - client_id: "demo-client-ops"
      public: true
      require_pkce: true
      redirect_uris:
        - "http://localhost:5174/auth/callback"
        - "http://127.0.0.1:5174/auth/callback"
      scopes:
        - "openid"
        - "profile"
        - "email"

auth:
  enabled_providers:
    - "account"

auth_admin:
  enabled: true
  secret_key: "quickstart-admin-session-secret"
  user_ids:
    - "usr_admin0000000000000000001a"
