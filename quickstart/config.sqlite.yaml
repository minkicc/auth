db:
  driver: "sqlite"
  sqlite_path: "/app/data/auth.sqlite3"

redis:
  addr: "redis:6379"
  password: ""
  db: 0

registration:
  mode: "open"
  require_invitation_for: []
  bootstrap_invitation_code: ""

storage:
  provider: "local"
  localPath: "/app/data/storage"
  attatchBucket: "attachments"

storage_public_url:
  attatch: "${AUTH_PUBLIC_URL}/storage"

oidc:
  enabled: true
  issuer: "${AUTH_PUBLIC_URL}"
  key_id: "auth-quickstart"
  private_key_file: "/app/data/oidc-private-key.pem"
  code_ttl_seconds: 300
  access_token_ttl_seconds: 900
  id_token_ttl_seconds: 900
  refresh_token_ttl_seconds: 2592000
  clients:
    - client_id: "demo-spa"
      public: true
      require_pkce: true
      redirect_uris:
        - "http://127.0.0.1:3000/"
        - "http://localhost:3000/"
      scopes:
        - "openid"
        - "profile"
        - "email"
    - client_id: "demo-oidc"
      public: true
      require_pkce: true
      grant_types:
        - "authorization_code"
        - "refresh_token"
      redirect_uris:
        - "http://localhost:3000/oauth/oidc"
        - "http://127.0.0.1:3000/oauth/oidc"
        - "http://localhost:3000/"
        - "http://127.0.0.1:3000/"
      scopes:
        - "openid"
        - "profile"
        - "email"
    - client_id: "demo-client"
      public: true
      require_pkce: true
      redirect_uris:
        - "http://localhost:5173/auth/callback"
        - "http://localhost:5173/merchant?logged_out=1"
        - "http://127.0.0.1:5173/auth/callback"
        - "http://127.0.0.1:5173/merchant?logged_out=1"
      scopes:
        - "openid"
        - "profile"
        - "email"
    - client_id: "demo-client-ops"
      public: true
      require_pkce: true
      redirect_uris:
        - "http://localhost:5174/auth/callback"
        - "http://127.0.0.1:5174/auth/callback"
      scopes:
        - "openid"
        - "profile"
        - "email"

auth:
  enabled_providers:
    - "account"

auth_admin:
  enabled: false
  user_ids: []
