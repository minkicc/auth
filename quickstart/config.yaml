db:
  user: "${MYSQL_USER}"
  password: "${MYSQL_PASSWORD}"
  host: "mysql"
  port: 3306
  database: "${MYSQL_DATABASE}"
  charset: "utf8mb4"

redis:
  addr: "redis:6379"
  password: ""
  db: 0

registration:
  # open / invite_only / disabled
  mode: "open"
  # When mode is invite_only, public self-service registration providers need
  # an invitation code by default. Set this list to override the default.
  require_invitation_for: []
  # Optional one-time bootstrap code for creating the first ordinary user.
  # After that user is created, put its user_id under auth_admin.user_ids.
  bootstrap_invitation_code: ""

secrets:
  # Optional. For local quickstart you can keep this empty.
  encryption_key_env: ""
  decryption_key_envs: []

storage:
  provider: "minio"
  endpoint: "minio:9000"
  region: "us-east-1"
  accessKeyID: "${MINIO_ATTACH_ACCESS_KEY}"
  secretAccessKey: "${MINIO_ATTACH_SECRET_KEY}"
  stsAccessKeyID: "${MINIO_STS_ACCESS_KEY}"
  stsSecretAccessKey: "${MINIO_STS_SECRET_KEY}"
  attatchBucket: "attatch"

storage_public_url:
  attatch: "http://127.0.0.1:9002/attatch"

oidc:
  enabled: true
  issuer: "${AUTH_PUBLIC_URL}"
  key_id: "auth-quickstart"
  private_key_file: "/app/data/oidc-private-key.pem"
  code_ttl_seconds: 300
  access_token_ttl_seconds: 900
  id_token_ttl_seconds: 900
  clients:
    - name: "Demo SPA"
      client_id: "demo-spa"
      public: true
      require_pkce: true
      redirect_uris:
        - "http://127.0.0.1:3000/"
        - "http://localhost:3000/"
      scopes:
        - "openid"
        - "profile"
        - "email"
auth:
  enabled_providers:
    - "account"

auth_admin:
  enabled: false
  # After the first admin account registers on the platform, put the internal
  # user ID here and restart the service.
  user_ids: []
  security_audit_export_job_retention_days: 7
  security_audit_export_job_auto_cleanup: true
