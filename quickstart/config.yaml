db:
  user: "root"
  password: "CHANGE_ME"
  host: "mysql"
  port: 3306
  database: "auth"
  charset: "utf8mb4"

redis:
  addr: "redis:6379"
  password: ""
  db: 0

storage:
  provider: "minio"
  endpoint: "minio:9000"
  region: "us-east-1"
  accessKeyID: "CHANGE_ME_minio_access"
  secretAccessKey: "CHANGE_ME_minio_secret"
  stsAccessKeyID: "user"
  stsSecretAccessKey: "CHANGE_ME_minio_sts_secret"
  attatchBucket: "attatch"

storage_public_url:
  attatch: "http://127.0.0.1:9002/attatch"

oidc:
  enabled: true
  issuer: ""
  key_id: "auth-quickstart"
  private_key_file: "/app/config/oidc-private-key.pem"
  code_ttl_seconds: 300
  access_token_ttl_seconds: 900
  id_token_ttl_seconds: 900
  clients:
    - client_id: "demo-spa"
      public: true
      require_pkce: true
      redirect_uris:
        - "http://127.0.0.1:3000/"
        - "http://localhost:3000/"
      scopes:
        - "openid"
        - "profile"
        - "email"
    - client_id: "demo-backend"
      client_secret: "demo-backend-secret"
      public: false
      require_pkce: true
      redirect_uris:
        - "http://127.0.0.1:8082/auth/callback"
        - "http://localhost:8082/auth/callback"
      scopes:
        - "openid"
        - "profile"
        - "email"
      # Example organization policy for B2B apps:
      # require_organization: true
      # allowed_organizations:
      #   - "acme"
      # required_org_roles:
      #   - "admin"

auth:
  enabled_providers:
    - "account"

auth_admin:
  enabled: false
